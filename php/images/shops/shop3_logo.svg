<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background and Shield Gradients -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="40%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Burger Gradients -->
    <linearGradient id="bunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="pattyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#291102" />
      <stop offset="100%" stop-color="#1c0a00" />
    </linearGradient>

    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="friesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <filter id="varsityShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Ring Shield Base -->
  <circle cx="250" cy="250" r="232" fill="none" stroke="url(#goldBorder)" stroke-width="12" filter="url(#varsityShadow)"/>
  <circle cx="250" cy="250" r="220" fill="#ffffff" />
  <circle cx="250" cy="250" r="202" fill="url(#shieldBg)" />

  <!-- Inner Campus Crest Shield -->
  <path d="M 250,75 L 375,125 C 375,260 330,345 250,400 C 170,345 125,260 125,125 Z" 
        fill="url(#shieldInner)" 
        stroke="url(#goldBorder)" 
        stroke-width="6" 
        filter="url(#varsityShadow)" />

  <!-- Dotted Star Pattern inside Shield -->
  <path d="M 250,92 L 358,135 C 358,250 320,325 250,375 C 180,325 142,250 142,135 Z" 
        fill="#ffffff" 
        opacity="0.15" />

  <!-- Crispy Golden French Fries (Behind Burger) -->
  <g transform="translate(305, 140) rotate(18)" filter="url(#varsityShadow)">
    <rect x="0" y="0" width="12" height="70" rx="3" fill="url(#friesGrad)" stroke="#ca8a04" stroke-width="1.5" />
    <rect x="16" y="-15" width="12" height="85" rx="3" fill="url(#friesGrad)" stroke="#ca8a04" stroke-width="1.5" />
    <rect x="32" y="-5" width="12" height="75" rx="3" fill="url(#friesGrad)" stroke="#ca8a04" stroke-width="1.5" />
    <rect x="48" y="10" width="12" height="60" rx="3" fill="url(#friesGrad)" stroke="#ca8a04" stroke-width="1.5" />
  </g>

  <!-- Crispy Fries Left -->
  <g transform="translate(130, 160) rotate(-22)" filter="url(#varsityShadow)">
    <rect x="0" y="0" width="12" height="65" rx="3" fill="url(#friesGrad)" stroke="#ca8a04" stroke-width="1.5" />
    <rect x="16" y="-10" width="12" height="75" rx="3" fill="url(#friesGrad)" stroke="#ca8a04" stroke-width="1.5" />
    <rect x="32" y="5" width="12" height="60" rx="3" fill="url(#friesGrad)" stroke="#ca8a04" stroke-width="1.5" />
  </g>

  <!-- Central Gourmet Burger -->
  <g transform="translate(250, 255)" filter="url(#varsityShadow)">
    <!-- Bottom Bun -->
    <path d="M -90,40 Q 0,62 90,40 Q 92,68 0,68 Q -92,68 -90,40 Z" fill="url(#bunGrad)" stroke="#78350f" stroke-width="3" />

    <!-- Grilled Patty -->
    <rect x="-96" y="18" width="192" height="24" rx="10" fill="url(#pattyGrad)" stroke="#000000" stroke-width="2" />
    <!-- Grill Marks on Patty -->
    <line x1="-70" y1="20" x2="-55" y2="40" stroke="#000000" stroke-width="3" stroke-linecap="round" />
    <line x1="-30" y1="20" x2="-15" y2="40" stroke="#000000" stroke-width="3" stroke-linecap="round" />
    <line x1="10" y1="20" x2="25" y2="40" stroke="#000000" stroke-width="3" stroke-linecap="round" />
    <line x1="50" y1="20" x2="65" y2="40" stroke="#000000" stroke-width="3" stroke-linecap="round" />

    <!-- Melted Golden Cheddar Cheese (with Drips) -->
    <path d="M -98,18 L -90,14 L 90,14 L 98,18 
             Q 75,35 60,18 
             Q 45,45 30,18 
             Q 0,38 -15,18 
             Q -35,50 -55,18 
             Q -75,35 -98,18 Z" 
          fill="url(#cheeseGrad)" stroke="#d97706" stroke-width="2" />

    <!-- Red Tomato Slices -->
    <rect x="-85" y="-2" width="80" height="15" rx="7" fill="#dc2626" stroke="#991b1b" stroke-width="2" />
    <rect x="5" y="-2" width="80" height="15" rx="7" fill="#dc2626" stroke="#991b1b" stroke-width="2" />

    <!-- Wavy Lettuce Leaf -->
    <path d="M -102,-6 Q -85,-18 -70,-6 Q -55,-18 -40,-6 Q -25,-18 -10,-6 Q 5,-18 20,-6 Q 35,-18 50,-6 Q 65,-18 80,-6 Q 95,-18 102,-6 L 98,4 L -98,4 Z" 
          fill="#22c55e" stroke="#15803d" stroke-width="2.5" />

    <!-- Top Brioche Bun -->
    <path d="M -96,-6 Q 0,-95 96,-6 Q 90,2 0,2 Q -90,2 -96,-6 Z" 
          fill="url(#bunGrad)" stroke="#78350f" stroke-width="3.5" />
    
    <!-- Sesame Seeds on Bun -->
    <ellipse cx="-45" cy="-45" rx="4" ry="2" fill="#fef08a" transform="rotate(-15, -45, -45)" />
    <ellipse cx="-15" cy="-60" rx="4" ry="2" fill="#fef08a" transform="rotate(5, -15, -60)" />
    <ellipse cx="25" cy="-55" rx="4" ry="2" fill="#fef08a" transform="rotate(20, 25, -55)" />
    <ellipse cx="55" cy="-35" rx="4" ry="2" fill="#fef08a" transform="rotate(-10, 55, -35)" />
    <ellipse cx="-60" cy="-25" rx="3.5" ry="2" fill="#fef08a" transform="rotate(25, -60, -25)" />
    <ellipse cx="0" cy="-35" rx="4" ry="2" fill="#fef08a" />
    <ellipse cx="40" cy="-20" rx="3.5" ry="2" fill="#fef08a" transform="rotate(-25, 40, -20)" />

    <!-- Chef's Gold Star Topper (Clean aesthetic, NO flag) -->
    <g transform="translate(0, -78)">
      <polygon points="0,-14 4,-4 14,-4 6,3 9,13 0,7 -9,13 -6,3 -14,-4 -4,-4" fill="url(#goldBorder)" stroke="#78350f" stroke-width="1.5" />
    </g>
  </g>

  <!-- Stars Accents Left and Right -->
  <g transform="translate(90, 250)" filter="url(#varsityShadow)">
    <polygon points="0,-12 3,-3 12,-3 5,2 7,11 0,6 -7,11 -5,2 -12,-3 -3,-3" fill="#fef08a" stroke="#b45309" stroke-width="1.5" />
  </g>
  <g transform="translate(410, 250)" filter="url(#varsityShadow)">
    <polygon points="0,-12 3,-3 12,-3 5,2 7,11 0,6 -7,11 -5,2 -12,-3 -3,-3" fill="#fef08a" stroke="#b45309" stroke-width="1.5" />
  </g>

  <!-- Top Banner Arc Text: VARSITY BITES -->
  <path id="topTextArcVarsity" d="M 65,245 A 185,185 0 0,1 435,245" fill="none" />
  <text fill="#ffffff" font-family="'Outfit', 'Impact', sans-serif" font-size="36" font-weight="900" letter-spacing="4" text-anchor="middle" filter="url(#varsityShadow)">
    <textPath href="#topTextArcVarsity" startOffset="50%">VARSITY BITES</textPath>
  </text>

  <!-- Bottom Collegiate Ribbon -->
  <g transform="translate(0, 360)" filter="url(#varsityShadow)">
    <!-- Ribbon Tails -->
    <path d="M 70,40 L 40,20 L 70,0 L 95,20 Z" fill="#7f1d1d" stroke="url(#goldBorder)" stroke-width="2" />
    <path d="M 430,40 L 460,20 L 430,0 L 405,20 Z" fill="#7f1d1d" stroke="url(#goldBorder)" stroke-width="2" />
    <!-- Ribbon Body -->
    <path d="M 85,35 L 115,10 L 385,10 L 415,35 L 385,60 L 115,60 Z" fill="#ffffff" stroke="url(#goldBorder)" stroke-width="4" />
    <text x="250" y="42" fill="#991b1b" font-family="'Outfit', 'Montserrat', sans-serif" font-size="20" font-weight="900" letter-spacing="3" text-anchor="middle">
      FAST FOOD &amp; GRILL
    </text>
  </g>

  <!-- Subtitle -->
  <text x="250" y="450" fill="#fef08a" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" letter-spacing="3" text-anchor="middle">
    JUICY BURGERS • WRAPS • FRIES
  </text>
</svg>
